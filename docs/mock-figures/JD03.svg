<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="巷口修鞋改衣小店裡帆布袋、牛仔外套與行李箱修補後展開第二段生活的插圖">
  <title>巷口修鞋改衣小店裡帆布袋、牛仔外套與行李箱修補後展開第二段生活的插圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="364" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>

  <rect x="20" y="18" width="720" height="38" rx="10" fill="#e8ede4"/>
  <text x="380" y="43" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">巷口修理店木牌：「壞掉的地方，不一定是終點。」</text>

  <!-- 卡片 1：拉鍊卡死的帆布袋 -->
  <rect x="28" y="72" width="220" height="232" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
  <rect x="78" y="90" width="120" height="90" rx="10" fill="#eef3ea"/>
  <path d="M 116 110 C 116 92, 160 92, 160 110" fill="none" stroke="#1e5641" stroke-width="3"/>
  <rect x="104" y="110" width="68" height="58" rx="6" fill="#d9e6d8" stroke="#1e5641" stroke-width="2"/>
  <line x1="108" y1="120" x2="168" y2="120" stroke="#b85328" stroke-width="2.5" stroke-dasharray="4 3"/>
  <rect x="158" y="115" width="8" height="10" rx="2" fill="#b85328"/>
  <text x="138" y="206" text-anchor="middle" class="s t-forest" font-size="14.5" font-weight="700">拉鍊卡死的帆布袋</text>
  <text x="138" y="230" text-anchor="middle" class="f t-soft" font-size="12.5">袋口拉鍊卡死、開合不順</text>
  <text x="138" y="255" text-anchor="middle" class="f t-clay" font-size="13" font-weight="700">↓ 換上新拉鍊</text>
  <text x="138" y="282" text-anchor="middle" class="f t-ink" font-size="12.5">又裝滿課本陪著出門</text>

  <!-- 卡片 2：磨損破洞的牛仔外套（補丁位於袖口與下擺衣角） -->
  <rect x="270" y="72" width="220" height="232" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
  <rect x="320" y="90" width="120" height="90" rx="10" fill="#f9ebe4"/>
  <path d="M 358 104 L 372 104 L 380 114 L 388 104 L 402 104 L 420 124 L 410 137 L 400 128 L 400 170 L 360 170 L 360 128 L 350 137 L 340 124 Z" fill="#5e7f91" stroke="#22352c" stroke-width="2" stroke-linejoin="round"/>
  <line x1="380" y1="114" x2="380" y2="170" stroke="#22352c" stroke-width="1.5"/>
  <!-- 右袖口彩色補丁 -->
  <rect x="405" y="122" width="12" height="10" rx="2" transform="rotate(38 411 127)" fill="#e5b869" stroke="#b85328" stroke-width="1.5" stroke-dasharray="2.5 1.5"/>
  <!-- 左下擺衣角彩色補丁 -->
  <rect x="361" y="156" width="13" height="12" rx="2" fill="#d9e6d8" stroke="#1e5641" stroke-width="1.5" stroke-dasharray="2.5 1.5"/>
  <text x="380" y="206" text-anchor="middle" class="s t-forest" font-size="14.5" font-weight="700">磨損破洞的牛仔外套</text>
  <text x="380" y="230" text-anchor="middle" class="f t-soft" font-size="12.5">衣角與袖口磨損破洞</text>
  <text x="380" y="255" text-anchor="middle" class="f t-clay" font-size="13" font-weight="700">↓ 縫上彩色補丁</text>
  <text x="380" y="282" text-anchor="middle" class="f t-ink" font-size="12.5">穿出獨一無二風格</text>

  <!-- 卡片 3：滾輪壞掉的行李箱 -->
  <rect x="512" y="72" width="220" height="232" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
  <rect x="562" y="90" width="120" height="90" rx="10" fill="#eef3ea"/>
  <rect x="594" y="108" width="56" height="52" rx="8" fill="#537864" stroke="#1e5641" stroke-width="2"/>
  <line x1="612" y1="98" x2="632" y2="98" stroke="#1e5641" stroke-width="3"/>
  <line x1="614" y1="98" x2="614" y2="108" stroke="#1e5641" stroke-width="2"/>
  <line x1="630" y1="98" x2="630" y2="108" stroke="#1e5641" stroke-width="2"/>
  <circle cx="604" cy="166" r="6" fill="#b85328"/>
  <circle cx="640" cy="166" r="6" fill="#b85328"/>
  <text x="622" y="206" text-anchor="middle" class="s t-forest" font-size="14.5" font-weight="700">滾輪壞掉的行李箱</text>
  <text x="622" y="230" text-anchor="middle" class="f t-soft" font-size="12.5">滾輪老化、拉起來卡卡的</text>
  <text x="622" y="255" text-anchor="middle" class="f t-clay" font-size="13" font-weight="700">↓ 換上新滾輪</text>
  <text x="622" y="282" text-anchor="middle" class="f t-ink" font-size="12.5">再次出發旅行</text>

  <!-- 底部思考小語 -->
  <rect x="28" y="318" width="704" height="32" rx="8" fill="#1e5641"/>
  <text x="380" y="339" text-anchor="middle" class="f t-white" font-size="13" font-weight="700">💡 除了修回原狀，也能親手改作、替舊物找到新用途</text>
</svg>
