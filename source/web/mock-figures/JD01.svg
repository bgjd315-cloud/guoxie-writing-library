<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="小宇原本想看五分鐘自然實驗，卻被自動推薦帶走一個半小時的情境圖解">
  <title>小宇原本想看五分鐘自然實驗，卻被自動推薦帶走一個半小時的情境圖解</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="360" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>

  <rect x="20" y="18" width="720" height="38" rx="10" fill="#e8ede4"/>
  <text x="380" y="43" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">引導圖示｜五分鐘的搜尋，怎麼變成一個半小時？</text>

  <!-- 左側：手機畫面 -->
  <rect x="34" y="74" width="236" height="260" rx="22" fill="#23372e" stroke="#182720" stroke-width="2"/>
  <rect x="45" y="90" width="214" height="226" rx="12" fill="#ffffff"/>
  <rect x="124" y="80" width="56" height="5" rx="2.5" fill="#4f665a"/>
  <!-- 正在播放 -->
  <rect x="56" y="101" width="192" height="58" rx="8" fill="#1e5641"/>
  <polygon points="144,115 144,137 163,126" fill="#faf8f1"/>
  <text x="152" y="152" text-anchor="middle" class="f t-white" font-size="11.5">自然實驗複習（5 分鐘）</text>
  <!-- 倒數接播提示 -->
  <rect x="56" y="167" width="192" height="32" rx="7" fill="#f9ebe4" stroke="#e4b8a1"/>
  <text x="152" y="187" text-anchor="middle" class="f t-clay" font-size="11.5" font-weight="700">⏱ 3 秒後自動接播下一則</text>
  <!-- 猜你喜歡列表 -->
  <text x="58" y="218" class="f t-soft" font-size="11" font-weight="700">猜你喜歡（自動推薦）</text>
  <rect x="56" y="226" width="192" height="24" rx="5" fill="#eef3ea"/>
  <text x="64" y="242" class="f t-ink" font-size="11.5">▶ 趣味開箱短片（45秒）</text>
  <rect x="56" y="255" width="192" height="24" rx="5" fill="#eef3ea"/>
  <text x="64" y="271" class="f t-ink" font-size="11.5">▶ 搞笑挑戰精選（1分鐘）</text>
  <rect x="56" y="284" width="192" height="24" rx="5" fill="#e4f0e8" stroke="#a6c4ad"/>
  <text x="64" y="300" class="f t-forest" font-size="10.5" font-weight="700">▶ 科普／籃球教學（偶有好靈感）</text>

  <!-- 中間：流失箭頭與時間軸 -->
  <path d="M 284 186 L 392 186" stroke="#b85328" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
  <polygon points="392,179 408,186 392,193" fill="#b85328"/>
  <rect x="284" y="122" width="120" height="50" rx="10" fill="#fffdf8" stroke="#d8c3a5"/>
  <text x="344" y="143" text-anchor="middle" class="f t-clay" font-size="12.5" font-weight="700">20:00 → 21:30</text>
  <text x="344" y="162" text-anchor="middle" class="f t-soft" font-size="11.5">不知不覺 90 分鐘</text>
  <text x="344" y="212" text-anchor="middle" class="f t-soft" font-size="12">「再看一支就好…」</text>

  <!-- 右側：書桌上的時鐘與講義 -->
  <rect x="422" y="74" width="306" height="260" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
  <!-- 時鐘 -->
  <circle cx="492" cy="144" r="40" fill="#eef3ea" stroke="#1e5641" stroke-width="3"/>
  <circle cx="492" cy="144" r="3.5" fill="#1e5641"/>
  <line x1="492" y1="144" x2="468" y2="144" stroke="#1e5641" stroke-width="3" stroke-linecap="round"/>
  <line x1="492" y1="144" x2="492" y2="172" stroke="#b85328" stroke-width="2.5" stroke-linecap="round"/>
  <text x="492" y="117" text-anchor="middle" class="f t-soft" font-size="10">12</text>
  <text x="492" y="179" text-anchor="middle" class="f t-soft" font-size="10">6</text>
  <text x="550" y="138" class="f t-clay" font-size="14" font-weight="700">已過 1.5 小時</text>
  <text x="550" y="160" class="f t-soft" font-size="12.5">卻說不出看了什麼</text>
  <!-- 攤開的講義 -->
  <path d="M 454 222 L 575 214 L 696 222 L 696 308 L 575 300 L 454 308 Z" fill="#ffffff" stroke="#8aa18c" stroke-width="2"/>
  <line x1="575" y1="214" x2="575" y2="300" stroke="#8aa18c" stroke-width="1.5"/>
  <text x="515" y="248" text-anchor="middle" class="s t-forest" font-size="14" font-weight="700">自然科講義</text>
  <line x1="472" y1="264" x2="558" y2="264" stroke="#cbd6c6" stroke-width="2"/>
  <line x1="472" y1="278" x2="546" y2="278" stroke="#cbd6c6" stroke-width="2"/>
  <rect x="594" y="236" width="84" height="48" rx="6" fill="#f9ebe4" stroke="#e4b8a1"/>
  <text x="636" y="257" text-anchor="middle" class="f t-clay" font-size="13" font-weight="700">仍停在</text>
  <text x="636" y="276" text-anchor="middle" class="f t-clay" font-size="13" font-weight="700">第 1 頁</text>
</svg>
