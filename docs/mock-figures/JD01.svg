<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="小宇原本想看五分鐘自然實驗，卻被自動推薦帶走一個半小時的情境圖解">
  <title>小宇原本想看五分鐘自然實驗，卻被自動推薦帶走一個半小時的情境圖解</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="360" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>
  
    <rect x="20" y="18" width="720" height="38" rx="10" fill="#e8ede4"/>
    <text x="380" y="43" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">引導圖示｜五分鐘的搜尋，怎麼變成一個半小時？</text>

    <!-- 左側：手機畫面 -->
    <rect x="38" y="76" width="225" height="256" rx="22" fill="#23372e" stroke="#182720" stroke-width="2"/>
    <rect x="49" y="92" width="203" height="222" rx="12" fill="#ffffff"/>
    <rect x="122" y="81" width="56" height="5" rx="2.5" fill="#4f665a"/>
    <!-- 正在播放 -->
    <rect x="61" y="104" width="179" height="62" rx="8" fill="#1e5641"/>
    <polygon points="142,122 142,146 162,134" fill="#faf8f1"/>
    <text x="150" y="160" text-anchor="middle" class="f t-white" font-size="11">自然實驗複習（5 分鐘）</text>
    <!-- 倒數接播提示 -->
    <rect x="61" y="174" width="179" height="32" rx="7" fill="#f9ebe4" stroke="#e4b8a1"/>
    <text x="150" y="194" text-anchor="middle" class="f t-clay" font-size="11.5" font-weight="700">⏱ 3 秒後自動接播下一則</text>
    <!-- 猜你喜歡列表 -->
    <text x="63" y="224" class="f t-soft" font-size="10.5" font-weight="700">猜你喜歡（無限推薦）</text>
    <rect x="61" y="232" width="179" height="22" rx="5" fill="#eef3ea"/>
    <text x="70" y="247" class="f t-ink" font-size="11">▶ 趣味開箱短片（45秒）</text>
    <rect x="61" y="259" width="179" height="22" rx="5" fill="#eef3ea"/>
    <text x="70" y="274" class="f t-ink" font-size="11">▶ 搞笑挑戰精選（1分鐘）</text>
    <rect x="61" y="286" width="179" height="22" rx="5" fill="#eef3ea"/>
    <text x="70" y="301" class="f t-ink" font-size="11">▶ 遊戲神操作合輯…</text>

    <!-- 中間：流失箭頭與時間軸 -->
    <path d="M 284 185 L 392 185" stroke="#b85328" stroke-width="3" stroke-dasharray="6 5" fill="none"/>
    <polygon points="392,178 408,185 392,192" fill="#b85328"/>
    <rect x="285" y="124" width="114" height="48" rx="10" fill="#fffdf8" stroke="#d8c3a5"/>
    <text x="342" y="144" text-anchor="middle" class="f t-clay" font-size="12" font-weight="700">20:00 → 21:30</text>
    <text x="342" y="162" text-anchor="middle" class="f t-soft" font-size="11">不知不覺 90 分鐘</text>
    <text x="342" y="210" text-anchor="middle" class="f t-soft" font-size="11">「再看一支就好…」</text>

    <!-- 右側：書桌上的時鐘與講義 -->
    <rect x="422" y="76" width="300" height="256" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
    <!-- 時鐘 -->
    <circle cx="510" cy="144" r="40" fill="#eef3ea" stroke="#1e5641" stroke-width="3"/>
    <circle cx="510" cy="144" r="3.5" fill="#1e5641"/>
    <line x1="510" y1="144" x2="486" y2="144" stroke="#1e5641" stroke-width="3" stroke-linecap="round"/>
    <line x1="510" y1="144" x2="510" y2="172" stroke="#b85328" stroke-width="2.5" stroke-linecap="round"/>
    <text x="510" y="117" text-anchor="middle" class="f t-soft" font-size="9.5">12</text>
    <text x="510" y="179" text-anchor="middle" class="f t-soft" font-size="9.5">6</text>
    <text x="566" y="139" class="f t-clay" font-size="13" font-weight="700">已過 1.5 小時</text>
    <text x="566" y="159" class="f t-soft" font-size="11.5">卻說不出看了什麼</text>
    <!-- 攤開的講義 -->
    <path d="M 454 222 L 570 214 L 686 222 L 686 306 L 570 298 L 454 306 Z" fill="#ffffff" stroke="#8aa18c" stroke-width="2"/>
    <line x1="570" y1="214" x2="570" y2="298" stroke="#8aa18c" stroke-width="1.5"/>
    <text x="512" y="246" text-anchor="middle" class="s t-forest" font-size="13" font-weight="700">自然科講義</text>
    <line x1="472" y1="262" x2="552" y2="262" stroke="#cbd6c6" stroke-width="2"/>
    <line x1="472" y1="276" x2="542" y2="276" stroke="#cbd6c6" stroke-width="2"/>
    <rect x="588" y="238" width="80" height="44" rx="6" fill="#f9ebe4" stroke="#e4b8a1"/>
    <text x="628" y="258" text-anchor="middle" class="f t-clay" font-size="12" font-weight="700">仍停在</text>
    <text x="628" y="275" text-anchor="middle" class="f t-clay" font-size="12" font-weight="700">第 1 頁</text>
  
</svg>
