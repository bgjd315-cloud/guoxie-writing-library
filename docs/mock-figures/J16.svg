<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-label="同一則午休時間微調通知的兩種社群標題與轉傳熱度對照圖">
  <title>同一則午休時間微調通知的兩種社群標題與轉傳熱度對照圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="310" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>
  
    <rect x="20" y="18" width="720" height="36" rx="10" fill="#e8ede4"/>
    <text x="380" y="42" text-anchor="middle" class="s t-forest" font-size="15.5" font-weight="700">社群標題對照｜同一件事（午休集合延後 5 分鐘），為何反應天差地遠？</text>

    <rect x="30" y="72" width="336" height="212" rx="14" fill="#f5faf6" stroke="#a6c4ad" stroke-width="2"/>
    <rect x="48" y="88" width="84" height="24" rx="12" fill="#1e5641"/>
    <text x="90" y="104" text-anchor="middle" class="f t-white" font-size="11.5" font-weight="700">貼文甲</text>
    <rect x="48" y="126" width="300" height="72" rx="10" fill="#ffffff" stroke="#cfe0cb"/>
    <text x="64" y="154" class="s t-ink" font-size="14.5" font-weight="700">「午休社團集合時間微調五分鐘，</text>
    <text x="64" y="178" class="s t-ink" font-size="14.5" font-weight="700">　請各社團同學留意。」</text>
    <text x="52" y="226" class="f t-soft" font-size="12">👍 按讚：12　　🔁 轉傳：3　　💬 留言：2</text>
    <text x="52" y="256" class="f t-forest" font-size="11.5" font-weight="700">特徵：如實陳述事實，語氣平靜客觀</text>

    <rect x="394" y="72" width="336" height="212" rx="14" fill="#fff9f5" stroke="#e4b8a1" stroke-width="2"/>
    <rect x="412" y="88" width="84" height="24" rx="12" fill="#b85328"/>
    <text x="454" y="104" text-anchor="middle" class="f t-white" font-size="11.5" font-weight="700">貼文乙</text>
    <rect x="412" y="126" width="300" height="72" rx="10" fill="#ffffff" stroke="#ebd1c2"/>
    <text x="428" y="154" class="s t-clay" font-size="14.5" font-weight="700">「全校都驚呆了！學校偷偷對午休</text>
    <text x="428" y="178" class="s t-clay" font-size="14.5" font-weight="700">　動手腳，學生權益全沒了？！」</text>
    <text x="416" y="226" class="f t-clay" font-size="12" font-weight="700">👍 按讚：128　　🔁 轉傳：95　　💬 怒罵留言：46</text>
    <text x="416" y="256" class="f t-clay" font-size="11.5" font-weight="700">特徵：聳動誇大、挑動情緒，許多人未讀內文便轉傳</text>
  
</svg>
