<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-label="幸福國中400位學生放學後最常安排休閒活動單選調查長條圖">
  <title>幸福國中400位學生放學後最常安排休閒活動單選調查長條圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="390" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>

  <rect x="20" y="18" width="720" height="44" rx="10" fill="#e8ede4"/>
  <text x="380" y="38" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">幸福國中「放學後最常安排的休閒活動」問卷統計圖</text>
  <text x="380" y="55" text-anchor="middle" class="f t-soft" font-size="11.5">調查對象：全校學生（有效問卷 400 份・每人限單選一項）</text>

  <!-- 座標區底板 -->
  <rect x="30" y="76" width="700" height="218" rx="12" fill="#ffffff" stroke="#d5dfd0"/>
  <!-- 格線 0%..60% (x: 242 to 680, width 438 -> 7.3px per 1%) -->
  <line x1="242" y1="92" x2="242" y2="262" stroke="#8aa18c" stroke-width="1.5"/>
  <line x1="315" y1="92" x2="315" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>
  <line x1="388" y1="92" x2="388" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>
  <line x1="461" y1="92" x2="461" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>
  <line x1="534" y1="92" x2="534" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>
  <line x1="607" y1="92" x2="607" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>
  <line x1="680" y1="92" x2="680" y2="262" stroke="#e8ede4" stroke-dasharray="4 3"/>

  <!-- 橫軸刻度 -->
  <text x="242" y="280" text-anchor="middle" class="f t-soft" font-size="11">0%</text>
  <text x="315" y="280" text-anchor="middle" class="f t-soft" font-size="11">10%</text>
  <text x="388" y="280" text-anchor="middle" class="f t-soft" font-size="11">20%</text>
  <text x="461" y="280" text-anchor="middle" class="f t-soft" font-size="11">30%</text>
  <text x="534" y="280" text-anchor="middle" class="f t-soft" font-size="11">40%</text>
  <text x="607" y="280" text-anchor="middle" class="f t-soft" font-size="11">50%</text>
  <text x="680" y="280" text-anchor="middle" class="f t-soft" font-size="11">60%</text>

  <!-- Bar 1: 42% (306.6px) -->
  <text x="232" y="116" text-anchor="end" class="f t-ink" font-size="12.5" font-weight="700">滑手機／短影音社群</text>
  <rect x="242" y="100" width="307" height="23" rx="5" fill="#b85328"/>
  <text x="557" y="116" class="f t-clay" font-size="12.5" font-weight="700">42%（168人）</text>

  <!-- Bar 2: 23% (167.9px) -->
  <text x="232" y="149" text-anchor="end" class="f t-ink" font-size="12.5">打球或戶外運動</text>
  <rect x="242" y="133" width="168" height="23" rx="5" fill="#1e5641"/>
  <text x="418" y="149" class="f t-forest" font-size="12.5" font-weight="700">23%（92人）</text>

  <!-- Bar 3: 20% (146px) -->
  <text x="232" y="182" text-anchor="end" class="f t-ink" font-size="12.5">玩線上遊戲</text>
  <rect x="242" y="166" width="146" height="23" rx="5" fill="#527b66"/>
  <text x="396" y="182" class="f t-ink" font-size="12.5">20%（80人）</text>

  <!-- Bar 4: 10% (73px) -->
  <text x="232" y="215" text-anchor="end" class="f t-ink" font-size="12.5">閱讀課外書或手作</text>
  <rect x="242" y="199" width="73" height="23" rx="5" fill="#82a88c"/>
  <text x="323" y="215" class="f t-ink" font-size="12.5">10%（40人）</text>

  <!-- Bar 5: 5% (36.5px) -->
  <text x="232" y="248" text-anchor="end" class="f t-ink" font-size="12.5">其他（練樂器、聊天散步）</text>
  <rect x="242" y="232" width="37" height="23" rx="5" fill="#b7cab9"/>
  <text x="287" y="248" class="f t-soft" font-size="12.5">5%（20人）</text>

  <!-- 下方思辨對話氣泡 -->
  <rect x="30" y="308" width="335" height="62" rx="11" fill="#f9ebe4" stroke="#e4b8a1"/>
  <text x="46" y="330" class="f t-clay" font-size="12.5" font-weight="700">💬 校內議論：</text>
  <text x="46" y="352" class="f t-ink" font-size="11.5">「超過四成都在滑手機，證明學生都不愛看書運動！」</text>

  <rect x="395" y="308" width="335" height="62" rx="11" fill="#eef5ee" stroke="#a6c4ad"/>
  <text x="411" y="330" class="f t-forest" font-size="12.5" font-weight="700">💬 同學提醒：</text>
  <text x="411" y="352" class="f t-ink" font-size="11.5">「只能單選又沒問原因，表格看得見全部實情嗎？」</text>
</svg>
