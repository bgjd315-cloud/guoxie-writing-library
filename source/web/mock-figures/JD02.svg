<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 364" role="img" aria-label="阿哲與小晴兩種使用 AI 輔助學習方式的對照圖">
  <title>阿哲與小晴兩種使用 AI 輔助學習方式的對照圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="364" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>

  <rect x="20" y="18" width="720" height="40" rx="10" fill="#e8ede4"/>
  <text x="380" y="44" text-anchor="middle" class="s t-forest" font-size="16.5" font-weight="700">雙情境對照｜同一款工具，為什麼學到的深度完全不同？</text>

  <!-- 左卡：阿哲 -->
  <rect x="26" y="74" width="342" height="268" rx="14" fill="#fff9f5" stroke="#e4b8a1" stroke-width="2"/>
  <rect x="44" y="88" width="132" height="28" rx="14" fill="#b85328"/>
  <text x="110" y="107" text-anchor="middle" class="f t-white" font-size="13.5" font-weight="700">情境一｜阿哲</text>

  <rect x="44" y="128" width="306" height="48" rx="9" fill="#ffffff" stroke="#ebd1c2"/>
  <text x="58" y="149" class="f t-clay" font-size="13.5" font-weight="700">① 直接把題目貼給 AI</text>
  <text x="58" y="168" class="f t-soft" font-size="13">幾秒拿到短文，改幾個詞便交件</text>

  <text x="197" y="193" text-anchor="middle" class="f t-clay" font-size="15" font-weight="700">↓</text>

  <rect x="44" y="199" width="306" height="48" rx="9" fill="#ffffff" stroke="#ebd1c2"/>
  <text x="58" y="220" class="f t-clay" font-size="13.5" font-weight="700">② 十分鐘交出工整作業</text>
  <text x="58" y="239" class="f t-soft" font-size="13">省下時間，卻跳過思考與卡關</text>

  <text x="197" y="264" text-anchor="middle" class="f t-clay" font-size="15" font-weight="700">↓</text>

  <rect x="44" y="270" width="306" height="58" rx="9" fill="#f9ebe4" stroke="#b85328" stroke-width="1.5"/>
  <text x="58" y="294" class="f t-clay" font-size="13.5" font-weight="700">③ 上台被追問「為什麼同意」</text>
  <text x="58" y="316" class="f t-ink" font-size="13">望著投影片，一句理由也答不上來</text>

  <!-- 右卡：小晴 -->
  <rect x="392" y="74" width="342" height="268" rx="14" fill="#f5faf6" stroke="#a6c4ad" stroke-width="2"/>
  <rect x="410" y="88" width="132" height="28" rx="14" fill="#1e5641"/>
  <text x="476" y="107" text-anchor="middle" class="f t-white" font-size="13.5" font-weight="700">情境二｜小晴</text>

  <rect x="410" y="128" width="306" height="48" rx="9" fill="#ffffff" stroke="#c8dccb"/>
  <text x="424" y="149" class="f t-forest" font-size="13.5" font-weight="700">① 先手寫草稿與卡關處</text>
  <text x="424" y="168" class="f t-soft" font-size="13">先自己動腦整理，找出不懂的地方</text>

  <text x="563" y="193" text-anchor="middle" class="f t-forest" font-size="15" font-weight="700">↓</text>

  <rect x="410" y="199" width="306" height="48" rx="9" fill="#ffffff" stroke="#c8dccb"/>
  <text x="424" y="220" class="f t-forest" font-size="13.5" font-weight="700">② 請 AI 舉例、挑出盲點</text>
  <text x="424" y="239" class="f t-soft" font-size="13">請 AI 檢查理由清楚嗎、出題考自己</text>

  <text x="563" y="264" text-anchor="middle" class="f t-forest" font-size="15" font-weight="700">↓</text>

  <rect x="410" y="270" width="306" height="58" rx="9" fill="#e4f0e8" stroke="#1e5641" stroke-width="1.5"/>
  <text x="424" y="294" class="f t-forest" font-size="13.5" font-weight="700">③ 先自己動腦，變聰明的是自己</text>
  <text x="424" y="316" class="f t-ink" font-size="13">工具當陪練幫手，理解越學越扎實 ✓</text>
</svg>
