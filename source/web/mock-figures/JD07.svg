<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="三種日常設施對幼童、受傷同學與長輩造成隱形門檻的觀察插圖">
  <title>三種日常設施對幼童、受傷同學與長輩造成隱形門檻的觀察插圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="350" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>
  
    <rect x="20" y="18" width="720" height="38" rx="10" fill="#e8ede4"/>
    <text x="380" y="43" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">設計偵探眼｜對多數人很順手的安排，誰被留在外面？</text>

    <!-- 格 1：太高的水龍頭 -->
    <rect x="28" y="76" width="220" height="212" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
    <rect x="52" y="94" width="172" height="102" rx="10" fill="#eef5ee"/>
    <rect x="132" y="112" width="72" height="10" rx="4" fill="#537864"/>
    <circle cx="152" cy="134" r="9" fill="#f9ebe4" stroke="#b85328" stroke-width="1.5"/>
    <text x="152" y="138" text-anchor="middle" class="f t-clay" font-size="11" font-weight="700">✕</text>
    <text x="168" y="156" text-anchor="middle" class="f t-clay" font-size="10.5" font-weight="700">感應不到出水</text>
    <circle cx="96" cy="154" r="11" fill="#d9a75a"/>
    <path d="M 96 165 L 96 188 M 96 172 L 122 146" stroke="#22352c" stroke-width="3" stroke-linecap="round"/>
    <text x="138" y="218" text-anchor="middle" class="s t-forest" font-size="13.5" font-weight="700">① 感應不到高水龍頭</text>
    <text x="138" y="242" text-anchor="middle" class="f t-soft" font-size="11.5">身高較矮的小學生伸長手</text>
    <text x="138" y="262" text-anchor="middle" class="f t-clay" font-size="11.5" font-weight="700">踮腳仍感應不到出水</text>

    <!-- 格 2：沒有扶手的階梯 -->
    <rect x="270" y="76" width="220" height="212" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
    <rect x="294" y="94" width="172" height="102" rx="10" fill="#f9ebe4"/>
    <path d="M 302 186 L 366 186 L 366 168 L 412 168 L 412 150 L 458 150" fill="none" stroke="#b85328" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="338" cy="130" r="10" fill="#537864"/>
    <path d="M 338 140 L 338 166 L 330 184 M 338 166 L 348 176 M 326 146 L 320 184 M 350 146 L 358 184" stroke="#22352c" stroke-width="2.5" stroke-linecap="round"/>
    <text x="380" y="218" text-anchor="middle" class="s t-clay" font-size="13.5" font-weight="700">② 沒有扶手的階梯</text>
    <text x="380" y="242" text-anchor="middle" class="f t-soft" font-size="11.5">拄柺杖的同學面對階梯</text>
    <text x="380" y="262" text-anchor="middle" class="f t-clay" font-size="11.5" font-weight="700">每走一步都戰戰兢兢</text>

    <!-- 格 3：字太小的自助點餐機 -->
    <rect x="512" y="76" width="220" height="212" rx="14" fill="#fffdf7" stroke="#d5dfd0" stroke-width="1.5"/>
    <rect x="536" y="94" width="172" height="102" rx="10" fill="#eef3ea"/>
    <rect x="614" y="106" width="66" height="78" rx="6" fill="#ffffff" stroke="#1e5641" stroke-width="2"/>
    <line x1="624" y1="120" x2="670" y2="120" stroke="#9eb2a3" stroke-width="2"/>
    <line x1="624" y1="130" x2="664" y2="130" stroke="#cbd6c6" stroke-width="1.5"/>
    <line x1="624" y1="138" x2="668" y2="138" stroke="#cbd6c6" stroke-width="1.5"/>
    <rect x="624" y="154" width="46" height="18" rx="4" fill="#f9ebe4"/>
    <text x="647" y="166" text-anchor="middle" class="f t-clay" font-size="8.5">細小選項…</text>
    <circle cx="576" cy="142" r="11" fill="#c7b8a1"/>
    <circle cx="582" cy="142" r="3.5" fill="none" stroke="#22352c" stroke-width="1.2"/>
    <path d="M 576 153 L 576 184 M 576 162 L 604 152" stroke="#22352c" stroke-width="2.8" stroke-linecap="round"/>
    <text x="622" y="218" text-anchor="middle" class="s t-forest" font-size="13.5" font-weight="700">③ 密麻小字的點餐機</text>
    <text x="622" y="242" text-anchor="middle" class="f t-soft" font-size="11.5">視力退化的長輩與初訪者</text>
    <text x="622" y="262" text-anchor="middle" class="f t-clay" font-size="11.5" font-weight="700">站著猶豫卻無從求助</text>

    <!-- 底部引導條 -->
    <rect x="28" y="302" width="704" height="32" rx="8" fill="#1e5641"/>
    <text x="380" y="323" text-anchor="middle" class="f t-white" font-size="12.5" font-weight="700">💡 寫作思考：換個高度看日常——你想怎麼改造身邊的一處小地方，讓每個人都更方便？</text>
  
</svg>
