<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-label="群體標籤與真實個人故事對照插圖">
  <title>群體標籤與真實個人故事對照插圖</title>
  <defs>
    <style>
      .f { font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }
      .s { font-family: 'Noto Serif TC', 'PMingLiU', serif; }
      .t-ink { fill: #22352c; }
      .t-soft { fill: #526359; }
      .t-forest { fill: #1e5641; }
      .t-clay { fill: #b85328; }
      .t-white { fill: #ffffff; }
    </style>
  </defs>
  <rect width="760" height="340" rx="16" fill="#faf8f1" stroke="#d5dfd0" stroke-width="2"/>
  
    <rect x="20" y="18" width="720" height="38" rx="10" fill="#e8ede4"/>
    <text x="380" y="43" text-anchor="middle" class="s t-forest" font-size="16" font-weight="700">引導圖示｜當一句「他們都這樣」貼上去，我們漏看了什麼？</text>

    <!-- 左側：公車上被貼上的大標籤 -->
    <rect x="32" y="76" width="322" height="238" rx="14" fill="#fff9f5" stroke="#e4b8a1" stroke-width="1.5"/>
    <text x="193" y="104" text-anchor="middle" class="s t-clay" font-size="14" font-weight="700">表面聽見的「群體標籤」</text>
    <!-- 傾斜標籤貼紙 -->
    <g transform="rotate(-3 193 158)">
      <rect x="64" y="124" width="258" height="64" rx="10" fill="#b85328"/>
      <text x="193" y="151" text-anchor="middle" class="f t-white" font-size="13.5" font-weight="700">「現在的國中生都只會滑手機、</text>
      <text x="193" y="172" text-anchor="middle" class="f t-white" font-size="13.5" font-weight="700">講話大聲、沒耐心！」</text>
    </g>
    <rect x="62" y="216" width="262" height="74" rx="10" fill="#ffffff" stroke="#ebd1c2" stroke-dasharray="4 3"/>
    <text x="193" y="242" text-anchor="middle" class="f t-clay" font-size="12" font-weight="700">但阿翰也想起自己曾貼過的標籤：</text>
    <text x="193" y="264" text-anchor="middle" class="f t-ink" font-size="11.5">「那個少話的轉學生，一定很難相處…」</text>

    <!-- 中間箭頭 -->
    <text x="380" y="198" text-anchor="middle" class="f t-forest" font-size="22" font-weight="700">⇄</text>

    <!-- 右側：撕開標籤看見的真實個體 -->
    <rect x="406" y="76" width="322" height="238" rx="14" fill="#f5faf6" stroke="#a6c4ad" stroke-width="1.5"/>
    <text x="567" y="104" text-anchor="middle" class="s t-forest" font-size="14" font-weight="700">標籤背後「真實獨特的人」</text>
    <rect x="430" y="122" width="274" height="78" rx="10" fill="#ffffff" stroke="#c8dccb"/>
    <text x="446" y="146" class="f t-forest" font-size="12.5" font-weight="700">🎒 靠窗站著的阿翰</text>
    <text x="446" y="168" class="f t-ink" font-size="11.5">• 剛把位子讓給提重物的老奶奶</text>
    <text x="446" y="188" class="f t-ink" font-size="11.5">• 書包裡裝著下週當圖書館志工的繪本</text>

    <rect x="430" y="216" width="274" height="74" rx="10" fill="#e4f0e8" stroke="#1e5641"/>
    <text x="446" y="240" class="f t-forest" font-size="12.5" font-weight="700">✏️ 原本安靜的轉學生</text>
    <text x="446" y="262" class="f t-ink" font-size="11.5">• 真正合作時點子最多、最細心可靠</text>
    <text x="446" y="280" class="f t-soft" font-size="11">→ 唯有靠近認識，才聽得見真實聲音</text>
  
</svg>
